version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    ignore:
      # TypeScript 7 is the native compiler and no longer ships the JavaScript
      # compiler API: typescript@7.1.0-beta exports only "version" and
      # "versionMajorMinor". typescript-eslint checks the major version when it
      # loads and throws before it lints a file, so pointing this dependency at
      # 7.x turns "npm run lint" red with nothing to fix on our side.
      #
      # typescript-eslint does support TypeScript 7.1, since its 8.73.0 release
      # of 16 November 2026, but it reaches the native compiler over IPC through
      # a second dependency and requires classic TypeScript 6.0 installed as
      # "typescript" for that path to start. So this one stays on the 6 line,
      # and TypeScript 7 arrives here as an addition rather than as this bump.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

      # @types/node describes the Node.js API surface the code is written
      # against, so it tracks the oldest Node.js this package supports rather
      # than the newest one that exists. package.json "engines" says
      # ">=20.9.0" and the checks run on Node 20 and Node 26, so the types
      # stay on the 20 line: that way "npm run type-check" rejects an API that
      # Node 20 does not have, instead of accepting code that only runs on the
      # newer job.
      #
      # This moves when the floor moves. Raise "engines" first, then raise
      # this to the same major in the same change.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
