name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest line package.json "engines" allows, and the current LTS.
        # "20" resolves to the newest Node.js 20 release, not to the 20.9.0
        # floor itself: 20.9.0 is from October 2023 and carries a V8 defect
        # that breaks a test through no fault of the widget's code.
        node-version: ["20", "26"]
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

  # One check to require in the branch protection rule for main, so that the
  # required check keeps working when the Node.js versions above change.
  all-checks-passed:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: checks
    if: always()
    steps:
      - name: Fail if any check failed
        if: needs.checks.result != 'success'
        run: |
          echo "Checks result: ${{ needs.checks.result }}"
          exit 1
